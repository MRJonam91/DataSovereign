name: Tests and privacy guard
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: node --check datasovereign/static/app.js
      - name: Core size
        shell: pwsh
        run: |
          $lines = (Get-ChildItem datasovereign -Filter *.py -File | Get-Content | Measure-Object -Line).Lines
          if ($lines -ge 1500) { throw "Core has $lines lines (limit 1499)" }
      - name: Reject obvious local data
        shell: pwsh
        run: |
          $bad = git ls-files | Select-String -Pattern '(^|/)(\.tmp|data|vault|exports|__pycache__)/|\.db$|\.pem$|\.p12$|\.pfx$'
          if ($bad) { throw "Possible local data files tracked: $bad" }
      - name: Build wheel and source archive
        if: matrix.python == '3.14'
        run: python -m build --outdir .tmp/dist
      - name: Verify installed wheel
        if: matrix.python == '3.14'
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem .tmp/dist -Filter *.whl).FullName
          python -m pip install --force-reinstall --no-deps $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location $env:RUNNER_TEMP
          python -P -m datasovereign --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -P -c 'from datasovereign.api import STATIC; assert all((STATIC / name).is_file() for name in ("index.html", "app.css", "app.js"))'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -P -m datasovereign doctor --data-dir "$env:RUNNER_TEMP/vault-smoke"
