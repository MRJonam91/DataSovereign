[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datasovereign-alpha"
version = "0.1.0"
description = "Local personal document vault with scoped temporary access"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
datasovereign = "datasovereign.cli:main"

[tool.setuptools]
packages = ["datasovereign"]

[tool.setuptools.package-data]
datasovereign = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
