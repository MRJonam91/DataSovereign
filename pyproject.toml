[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "datasovereign"
dynamic = ["version"]
description = "Local personal document vault with scoped temporary access"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2,<3", "starlette>=0.37.2,<2", "uvicorn>=0.30,<1"]
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
classifiers = ["Development Status :: 5 - Production/Stable", "Operating System :: Microsoft :: Windows", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "build>=1,<2"]

[project.scripts]
datasovereign = "datasovereign.cli:main"

[tool.setuptools]
packages = ["datasovereign"]

[tool.setuptools.dynamic]
version = {attr = "datasovereign.__version__"}

[tool.setuptools.package-data]
datasovereign = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
